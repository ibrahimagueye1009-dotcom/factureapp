name: facturation_pro
description: Générateur de factures SAER DRAME et D-T-E.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  pdf: ^3.11.0
  printing: ^5.13.1
  crypto: ^3.0.3
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  google_sign_in: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/fayo_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/images/tampon.png
    - assets/images/dte_logo.png
    - assets/images/fayo_icon.png
    - assets/fonts/LiberationSans-Regular.ttf
    - assets/fonts/LiberationSans-Bold.ttf
