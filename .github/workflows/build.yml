name: Build Flutter Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GoogleService-Info.plist
        env:
          PLIST_CONTENT: ${{ secrets.FIREBASE_IOS_PLIST }}
        run: |
          if [ -n "$PLIST_CONTENT" ]; then
            printf '%s' "$PLIST_CONTENT" > ios/Runner/GoogleService-Info.plist
          else
            printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>API_KEY</key><string>stub-api-key</string><key>GCM_SENDER_ID</key><string>000000000000</string><key>PLIST_VERSION</key><string>1</string><key>BUNDLE_ID</key><string>sn.saerdrame.facturationPro</string><key>PROJECT_ID</key><string>stub-project</string><key>STORAGE_BUCKET</key><string>stub-project.appspot.com</string><key>GOOGLE_APP_ID</key><string>1:000000000000:ios:stub0000000000</string></dict></plist>' > ios/Runner/GoogleService-Info.plist
            echo "::warning::Secret FIREBASE_IOS_PLIST absent — plist factice généré (build OK, Firebase inopérant à l'exécution)."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Runner.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app
